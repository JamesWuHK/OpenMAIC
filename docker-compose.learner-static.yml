services:
  openmaic:
    image: ${OPENMAIC_LEARNER_IMAGE:-openmaic-learner-openmaic:latest}
    env_file:
      - path: ${OPENMAIC_LEARNER_ENV_FILE:-learner.env}
        required: true
    build:
      context: .
      args:
        NEXT_BUILD_NODE_OPTIONS: '--max-old-space-size=3072'
        OPENMAIC_BUILD_CPUS: '1'
        NEXT_PUBLIC_OPENMAIC_DEPLOYMENT_MODE: learner
        NEXT_PUBLIC_PRO_WORKBENCH_ENABLED: 'false'
        NEXT_PUBLIC_MAIC_EDITOR_ENABLED: 'false'
        NEXT_PUBLIC_MAIC_EDITOR_RENDERER_ENABLED: 'false'
        NEXT_PUBLIC_PI_CHAT_ENABLED: 'true'
        NEXT_PUBLIC_ENABLE_VIDEO_EXPORT: 'false'
        NEXT_PUBLIC_ENABLE_PPTX_IMPORT: 'false'
    environment:
      OPENMAIC_DEPLOYMENT_MODE: learner
      TRUST_PROXY_HEADERS: 'true'
      LEARNER_SITE_CONTENT_PATH: /app/content/learner/site-content.json
      LEARNER_PUBLISHED_COURSES_PATH: /app/content/learner/published-courses.json
      NODE_ENV: production
    expose:
      - '3000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/classrooms:/app/data/classrooms:ro
      - ./data/teacher-submissions:/app/data/teacher-submissions
      - ./content/learner:/app/content/learner:ro
      - ./content/learner/media:/app/public/learner/runtime:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file:
      - path: ${OPENMAIC_LEARNER_POSTGRES_ENV_FILE:-learner.postgres.env}
        required: true
    environment:
      POSTGRES_DB: openmaic
      POSTGRES_USER: openmaic
    command: ['postgres', '-c', 'shared_buffers=64MB', '-c', 'max_connections=30']
    shm_size: 64mb
    mem_limit: 384m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openmaic -d openmaic']
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - learner_postgres:/var/lib/postgresql/data
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2-alpine
    depends_on:
      - openmaic
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  learner_postgres:
