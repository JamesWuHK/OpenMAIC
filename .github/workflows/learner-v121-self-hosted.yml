name: Learner v1.2.1 self-hosted candidate

on:
  workflow_dispatch:
    inputs:
      checks:
        description: Run focused learner tests and TypeScript without building an image
        type: boolean
        required: true
        default: false
      build:
        description: Run candidate tests and image build after resource preflight
        type: boolean
        required: true
        default: false
      reclaim_failed_build_cache:
        description: Remove only the known failed candidate container and dangling image cache
        type: boolean
        required: true
        default: false
      speech_probe:
        description: Probe synthetic Cantonese Edge TTS from an isolated runner container without building the learner image
        type: boolean
        required: true
        default: false

# Build/test only: no AWS/model credentials, image upload, or deployment.
permissions:
  contents: read
concurrency:
  group: learner-v121-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'JamesWuHK/OpenMAIC'
    runs-on: [self-hosted, Linux, X64, openmaic, cloud-ci]
    timeout-minutes: 90
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      IMAGE_TAG: wanli-learner-v121:${{ github.run_id }}-${{ github.sha }}
      CONTAINER_NAME: learner-v121-${{ github.run_id }}
      POSTGRES_CONTAINER_NAME: learner-v121-postgres-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reclaim only failed learner build residue
        if: inputs.reclaim_failed_build_cache
        run: |
          set -euo pipefail
          test -z "$(docker ps --quiet)"
          failed_container=cb62a4450221
          expected_image=9c5d243c1eb7
          if docker container inspect "$failed_container" >/dev/null 2>&1; then
            actual_image=$(docker container inspect "$failed_container" --format '{{.Image}}')
            expected_full_image=$(docker image inspect "$expected_image" --format '{{.Id}}')
            test "$actual_image" = "$expected_full_image"
            test "$(docker container inspect "$failed_container" --format '{{.State.Status}}')" = created
            docker container rm "$failed_container"
          fi
          docker image prune --force
          df -h /var/lib/docker
          df -i /var/lib/docker
          free_inodes=$(df -Pi /var/lib/docker | awk 'NR==2 {print $4}')
          test "$free_inodes" -ge 500000
      - name: Verify exact source and runner headroom
        run: |
          set -euo pipefail
          git rev-parse HEAD
          printf 'CANDIDATE_ROOT=%s/learner-v121-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          test "$(uname -m)" = x86_64
          docker info --format 'Docker server {{.ServerVersion}}; storage {{.Driver}}; root {{.DockerRootDir}}'
          docker system df
          docker image ls --all --format 'Image {{.ID}} {{.Repository}}:{{.Tag}} {{.Size}}'
          docker ps --all --format 'Container {{.ID}} {{.Image}} {{.Status}}'
          df -h "$GITHUB_WORKSPACE" /var/lib/docker
          df -i /var/lib/docker
          if sudo -n true 2>/dev/null; then
            sudo -n du -h -d1 /var/lib/docker 2>/dev/null || true
          fi
          if docker buildx version >/dev/null 2>&1; then docker buildx version; else echo 'Docker buildx unavailable'; fi
          available_kib=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')
          memory_kib=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
          total_kib=$(awk '/MemTotal:/ {print $2}' /proc/meminfo)
          printf 'Available disk: %s KiB; available memory: %s KiB\n' "$available_kib" "$memory_kib"
          printf 'Total memory: %s KiB\n' "$total_kib"
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            test "$memory_kib" -ge 5242880
            if [ "${{ inputs.build }}" = true ]; then
              test "$available_kib" -ge 20971520
              free_inodes=$(df -Pi /var/lib/docker | awk 'NR==2 {print $4}')
              printf 'Available Docker inodes: %s\n' "$free_inodes"
              test "$free_inodes" -ge 1000000
            fi
          else
            test "$available_kib" -ge 2097152
          fi
      - name: Probe free Cantonese speech from runner network
        if: github.event_name == 'workflow_dispatch' && inputs.speech_probe
        run: |
          set -euo pipefail
          docker run --rm --network bridge python:3.12-alpine sh -ec '
            python -m pip install --no-cache-dir edge-tts==7.3.1 >/dev/null
            start=$(date +%s)
            timeout 35 edge-tts --text "呢個想法幾有趣，我哋一齊試下。" \
              --voice zh-HK-WanLungNeural --rate +20% --write-media /tmp/speech.mp3
            test "$(wc -c </tmp/speech.mp3)" -gt 1000
            echo "Synthetic Edge TTS MP3 bytes: $(wc -c </tmp/speech.mp3)"
            echo "Elapsed seconds: $(($(date +%s) - start))"
          '
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: github.event_name == 'workflow_dispatch' && (inputs.checks || inputs.build)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: github.event_name == 'workflow_dispatch' && (inputs.checks || inputs.build)
        with:
          node-version: 22
          cache: pnpm
      - name: Install and compile workspace packages
        if: github.event_name == 'workflow_dispatch' && (inputs.checks || inputs.build)
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          NODE_OPTIONS=--max-old-space-size=1024 pnpm run build:packages
      - name: Learner regressions and TypeScript
        if: github.event_name == 'workflow_dispatch' && (inputs.checks || inputs.build)
        run: |
          node --test tests/learner/release-media.test.mjs tests/learner/live-source-parity.test.mjs tests/learner/upgrade-parity.test.mjs tests/learner/published-content-qa.test.mjs tests/learner/candidate-audio.test.mjs tests/learner/candidate-speech.test.mjs tests/learner/freeze-public-runtime.test.mjs
          pnpm exec vitest run tests/learner tests/api/classroom-media-range.test.ts tests/security/learner-boundary.test.ts
          memory_kib=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
          test "$memory_kib" -ge 5242880
          NODE_OPTIONS=--max-old-space-size=4096 pnpm exec tsc --noEmit
      - name: Build exact linux/amd64 learner image
        if: github.event_name == 'workflow_dispatch' && inputs.build
        run: |
          memory_kib=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
          test "$memory_kib" -ge 5242880
          docker build --file Dockerfile.learner-vfs --platform linux/amd64 --tag "$IMAGE_TAG" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --build-arg NEXT_BUILD_NODE_OPTIONS=--max-old-space-size=3072 \
            --build-arg OPENMAIC_BUILD_CPUS=1 \
            --build-arg NEXT_PUBLIC_OPENMAIC_DEPLOYMENT_MODE=learner \
            --build-arg NEXT_PUBLIC_PRO_WORKBENCH_ENABLED=false \
            --build-arg NEXT_PUBLIC_MAIC_EDITOR_ENABLED=false \
            --build-arg NEXT_PUBLIC_MAIC_EDITOR_RENDERER_ENABLED=false \
            --build-arg NEXT_PUBLIC_PI_CHAT_ENABLED=true \
            --build-arg NEXT_PUBLIC_ENABLE_VIDEO_EXPORT=false \
            --build-arg NEXT_PUBLIC_ENABLE_PPTX_IMPORT=false .
          docker image inspect "$IMAGE_TAG" --format 'Image ID {{.Id}}; architecture {{.Architecture}}; source {{index .Config.Labels "org.opencontainers.image.revision"}}'
      - name: Freeze current public classrooms for isolated candidate
        if: github.event_name == 'workflow_dispatch' && inputs.build
        run: |
          mkdir "$CANDIDATE_ROOT"
          LEARNER_QA_BASELINE_URL=https://class.wanli.ai \
            node scripts/freeze-public-learner-runtime.mjs "$CANDIDATE_ROOT"
          mkdir -p "$CANDIDATE_ROOT/data/teacher-submissions"
          chmod 0777 "$CANDIDATE_ROOT/data/teacher-submissions"
      - name: Isolated HTTP smoke test
        if: github.event_name == 'workflow_dispatch' && inputs.build
        run: |
          # This self-hosted runner's custom Docker bridges cannot reach Edge TTS.
          # The default bridge passed an external synthetic speech probe. Map
          # only this run's temporary PostgreSQL IP into the candidate; this
          # runner rejects legacy --link on its default bridge.
          docker run -d --name "$POSTGRES_CONTAINER_NAME" --network bridge \
            --tmpfs /var/lib/postgresql/data:rw,size=256m \
            -e POSTGRES_DB=openmaic -e POSTGRES_USER=openmaic \
            -e POSTGRES_PASSWORD=synthetic-ci-postgres-not-a-secret \
            postgres:16-alpine
          for attempt in {1..30}; do
            if docker exec "$POSTGRES_CONTAINER_NAME" pg_isready -U openmaic -d openmaic >/dev/null; then break; fi
            sleep 2
          done
          docker exec "$POSTGRES_CONTAINER_NAME" pg_isready -U openmaic -d openmaic
          postgres_ip=$(docker container inspect "$POSTGRES_CONTAINER_NAME" --format '{{.NetworkSettings.IPAddress}}')
          case "$postgres_ip" in ''|*[!0-9.]*) echo 'Invalid temporary PostgreSQL IP' >&2; exit 1 ;; esac
          docker run -d --name "$CONTAINER_NAME" -p 127.0.0.1::3000 \
            --network bridge --add-host "$POSTGRES_CONTAINER_NAME:$postgres_ip" \
            -e OPENMAIC_DEPLOYMENT_MODE=learner \
            -e DATABASE_URL="postgres://openmaic:synthetic-ci-postgres-not-a-secret@$POSTGRES_CONTAINER_NAME:5432/openmaic" \
            -e OPENAI_API_KEY=synthetic-ci-not-a-secret \
            -e OPENAI_BASE_URL=http://127.0.0.1:9/v1 \
            -e DEFAULT_MODEL=openai:gpt-4o-mini \
            -e LEARNER_SITE_CONTENT_PATH=/app/content/learner/site-content.json \
            -e LEARNER_PUBLISHED_COURSES_PATH=/app/content/learner/published-courses.json \
            -v "$CANDIDATE_ROOT/data/classrooms:/app/data/classrooms:ro" \
            -v "$CANDIDATE_ROOT/data/teacher-submissions:/app/data/teacher-submissions" \
            -v "$CANDIDATE_ROOT/content/learner:/app/content/learner:ro" \
            -v "$CANDIDATE_ROOT/content/learner/media:/app/public/learner/runtime:ro" \
            "$IMAGE_TAG"
          port=$(docker port "$CONTAINER_NAME" 3000/tcp | sed 's/.*://')
          for attempt in {1..30}; do
            if curl -fsS "http://127.0.0.1:$port/api/health" >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS "http://127.0.0.1:$port/api/health" >/dev/null
          curl -fsS "http://127.0.0.1:$port/api/learner/courses" >/dev/null
          curl -fsS "http://127.0.0.1:$port/courses" >/dev/null
          (
            cd "$CANDIDATE_ROOT"
            LEARNER_PUBLIC_URL="http://127.0.0.1:$port" \
              node "$GITHUB_WORKSPACE/scripts/qa-learner-published-content.mjs"
          )
          LEARNER_QA_CANDIDATE_URL="http://127.0.0.1:$port" \
            node scripts/qa-learner-candidate-audio.mjs
          docker exec --user 1001 "$CONTAINER_NAME" sh -ec '
            timeout 35 "$TTS_EDGE_BIN" --text "呢個想法幾有趣，我哋一齊試下。" \
              --voice zh-HK-WanLungNeural --rate +20% --write-media /tmp/learner-speech-probe.mp3
            test "$(wc -c </tmp/learner-speech-probe.mp3)" -gt 1000
            echo "Candidate direct Edge TTS MP3 bytes: $(wc -c </tmp/learner-speech-probe.mp3)"
          '
          LEARNER_QA_CANDIDATE_URL="http://127.0.0.1:$port" \
            node scripts/qa-learner-candidate-speech.mjs
          LEARNER_QA_BASELINE_URL=https://class.wanli.ai \
            LEARNER_QA_SITE_CONTENT_PATH="$CANDIDATE_ROOT/content/learner/site-content.json" \
            LEARNER_QA_CATALOG_PATH="$CANDIDATE_ROOT/content/learner/published-courses.json" \
            LEARNER_QA_CLASSROOMS_DIR="$CANDIDATE_ROOT/data/classrooms" \
            node scripts/qa-learner-live-source-parity.mjs
      - name: Isolated real-browser learner playback smoke
        if: github.event_name == 'workflow_dispatch' && inputs.build
        run: |
          set -euo pipefail
          # CLI-first browser check against the still-running temporary candidate.
          # Browser files stay in this runner's cache, outside the production host.
          npx --yes --package @playwright/cli@0.1.9 playwright-cli install-browser chromium
          export PLAYWRIGHT_CLI_SESSION="learner-v121-$GITHUB_RUN_ID"
          pw() { npx --yes --package @playwright/cli@0.1.9 playwright-cli "$@"; }
          trap 'pw close >/dev/null 2>&1 || true' EXIT
          port=$(docker port "$CONTAINER_NAME" 3000/tcp | sed 's/.*://')
          test -n "$port"
          pw open "http://127.0.0.1:$port/classroom/hk-a01-02-leaf-classifier"
          snapshot=''
          play_ref=''
          for attempt in {1..20}; do
            snapshot=$(pw snapshot)
            play_ref=$(printf '%s\n' "$snapshot" | sed -n 's/.*button "Play" \[ref=\(e[0-9]*\)\].*/\1/p' | head -1)
            if [ -n "$play_ref" ]; then break; fi
            sleep 2
          done
          test -n "$play_ref"
          printf '%s\n' "$snapshot" | grep -F '開場：四張圖怎樣分？'
          pw run-code 'async (page) => { await page.addInitScript(() => { const OriginalAudio = window.Audio; window.__probeAudio = []; window.Audio = function (...args) { const audio = new OriginalAudio(...args); window.__probeAudio.push(audio); return audio; }; window.Audio.prototype = OriginalAudio.prototype; }); await page.reload(); return "narration instrumented"; }'
          for attempt in {1..20}; do
            snapshot=$(pw snapshot)
            play_ref=$(printf '%s\n' "$snapshot" | sed -n 's/.*button "Play" \[ref=\(e[0-9]*\)\].*/\1/p' | head -1)
            if [ -n "$play_ref" ]; then break; fi
            sleep 2
          done
          test -n "$play_ref"
          pw click "$play_ref"
          pw run-code 'async (page) => { await page.waitForFunction(() => (window.__probeAudio || []).some(a => a.currentTime > 0.5 && !a.paused && a.readyState >= 3), null, { timeout: 15000 }); const state = await page.evaluate(() => ({ overflow: document.documentElement.scrollWidth > document.documentElement.clientWidth, audio: (window.__probeAudio || []).map(a => ({ currentTime: a.currentTime, readyState: a.readyState, src: a.currentSrc })) })); if (state.overflow) throw new Error("Desktop horizontal overflow"); const src = state.audio.find(a => a.currentTime > 0.5)?.src; if (!src) throw new Error("Narration did not advance"); const response = await page.request.get(src, { headers: { Range: "bytes=0-1023" } }); if (![200,206].includes(response.status()) || !response.headers()["content-type"]?.startsWith("audio/")) throw new Error("Narration media response failed: " + response.status()); return { state, mediaStatus: response.status(), mediaType: response.headers()["content-type"] }; }'
          pw resize 390 844
          pw reload
          for attempt in {1..20}; do
            snapshot=$(pw snapshot)
            play_ref=$(printf '%s\n' "$snapshot" | sed -n 's/.*button "Play" \[ref=\(e[0-9]*\)\].*/\1/p' | head -1)
            if [ -n "$play_ref" ]; then break; fi
            sleep 2
          done
          test -n "$play_ref"
          pw click "$play_ref"
          pw run-code 'async (page) => { await page.waitForFunction(() => (window.__probeAudio || []).some(a => a.currentTime > 0.5 && !a.paused && a.readyState >= 3), null, { timeout: 15000 }); const dimensions = await page.evaluate(() => ({ width: document.documentElement.clientWidth, scrollWidth: document.documentElement.scrollWidth })); if (dimensions.scrollWidth > dimensions.width) throw new Error("390px horizontal overflow: " + JSON.stringify(dimensions)); return dimensions; }'
          console_output=$(pw console error)
          printf '%s\n' "$console_output"
          printf '%s\n' "$console_output" | grep -Eq 'Errors: 0|Total messages: 0'
      - name: Clean up only this run's candidate
        if: always() && github.event_name == 'workflow_dispatch' && inputs.build
        run: |
          docker logs "$CONTAINER_NAME" --tail 60 2>&1 || true
          if docker container inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
            docker container rm -f "$CONTAINER_NAME"
          fi
          if docker container inspect "$POSTGRES_CONTAINER_NAME" >/dev/null 2>&1; then
            docker container rm -f "$POSTGRES_CONTAINER_NAME"
          fi
          if docker image inspect "$IMAGE_TAG" >/dev/null 2>&1; then
            docker image rm "$IMAGE_TAG"
          fi
          case "$CANDIDATE_ROOT" in
            "$RUNNER_TEMP"/learner-v121-"$GITHUB_RUN_ID")
              if [ -d "$CANDIDATE_ROOT" ]; then rm -r -- "$CANDIDATE_ROOT"; fi
              ;;
            *) echo 'Refusing unexpected candidate cleanup path' >&2; exit 1 ;;
          esac
