{
  "name": "Sakaguchi content-only cloud acceptance",
  "on": {
    "push": {
      "branches": [
        "codex/sakaguchi-release-20261105"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "sakaguchi-content-20261105",
    "cancel-in-progress": false
  },
  "jobs": {
    "acceptance": {
      "runs-on": "ubuntu-22.04",
      "timeout-minutes": 20,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false,
            "sparse-checkout": "ci/sakaguchi-release"
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": 22
          }
        },
        {
          "run": "npm install --no-save --package-lock=false playwright\nnpx playwright install --with-deps chromium",
          "working-directory": "ci/sakaguchi-release"
        },
        {
          "name": "Inspect actual deployed classroom in cloud browser",
          "run": "node ci/sakaguchi-release/probe.mjs"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "sakaguchi-cloud-${{ github.sha }}",
            "path": "artifacts/sakaguchi",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
