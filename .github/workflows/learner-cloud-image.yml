name: Nobel series real production acceptance

on:
  workflow_dispatch:

# This separate branch performs authorized post-release browser QA only.
permissions:
  contents: read

concurrency:
  group: nobel-series-real-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-production-discussion:
    if: github.repository == 'JamesWuHK/OpenMAIC' && github.ref == 'refs/heads/codex/nobel-series-real-qa'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: 'true'
      NOBEL_QA_BASE_URL: https://class.wanli.ai
      NOBEL_QA_CLASSROOMS_DIR: ci/nobel-acceptance/classrooms
      NOBEL_QA_OUTPUT_DIR: artifacts/nobel-series-real-discussion-${{ github.run_id }}
      NEXT_TELEMETRY_DISABLED: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium on the Actions runner
        run: pnpm exec playwright install --with-deps chromium
      - name: Real production six-course two-turn discussion acceptance
        run: node scripts/qa-nobel-series-real-discussion.mjs
      - name: Upload actual replies, playback evidence and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nobel-series-real-discussion-${{ github.run_id }}
          path: artifacts/nobel-series-real-discussion-${{ github.run_id }}/
          retention-days: 7
          if-no-files-found: warn
