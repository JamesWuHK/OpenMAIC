{
  "name": "Learner cloud image candidate",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "openmaic-linux-candidate",
    "cancel-in-progress": false
  },
  "jobs": {
    "candidate": {
      "if": "github.repository == 'JamesWuHK/OpenMAIC'",
      "runs-on": [
        "self-hosted",
        "Linux",
        "X64",
        "openmaic",
        "cloud-ci"
      ],
      "timeout-minutes": 90,
      "env": {
        "CI": "true",
        "NEXT_TELEMETRY_DISABLED": "1",
        "PUPPETEER_SKIP_DOWNLOAD": "true"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Capacity and run ownership",
          "run": "python3 scripts/ci/nobel-resources.py capacity\npython3 scripts/ci/nobel-resources.py init"
        },
        {
          "uses": "pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1"
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": 22,
            "cache": "pnpm"
          }
        },
        {
          "name": "Install dependencies sequentially",
          "env": {
            "NODE_OPTIONS": "--max-old-space-size=1536",
            "MAKEFLAGS": "-j1"
          },
          "run": "pnpm install --frozen-lockfile --network-concurrency=2 --child-concurrency=1"
        },
        {
          "name": "Ownership and packaging regression",
          "run": "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/ci -p test_nobel_resources.py\nnode --test tests/ci/nobel-runner-preflight.test.mjs tests/ci/nobel-image-workflow.test.mjs tests/ci/learner-image-prompt-inputs.test.mjs"
        },
        {
          "name": "Relevant regression tests",
          "env": {
            "NODE_OPTIONS": "--max-old-space-size=1536"
          },
          "run": "pnpm exec vitest run --maxWorkers=1 --no-file-parallelism tests/pbl/v2/evaluator.test.ts tests/pbl/v2/learner-state.test.ts tests/learner tests/security/learner-boundary.test.ts tests/security/learner-middleware.test.ts tests/server/install-process-shutdown-handlers.test.ts tests/audio/discussion-speech-drain.test.ts tests/lib/buffer/stream-buffer.test.ts tests/lib/chat/use-chat-sessions.test.ts tests/playback/action-navigation.test.ts tests/playback/discussion-consumption.test.ts"
        },
        {
          "name": "TypeScript",
          "env": {
            "NODE_OPTIONS": "--max-old-space-size=3072"
          },
          "run": "pnpm exec tsc --noEmit"
        },
        {
          "name": "Capacity before bounded build",
          "run": "python3 scripts/ci/nobel-resources.py capacity --after-install"
        },
        {
          "name": "Refuse existing builder container",
          "run": "existing=$(docker container ls --all --filter \"name=^/buildx_buildkit_${BUILDER_NAME}0$\" --format '{{.ID}}')\ntest -z \"$existing\"\ntest \"$(find \"$DOCKER_CONFIG\" -mindepth 1 -maxdepth 1 | wc -l)\" -eq 0"
        },
        {
          "id": "builder",
          "name": "Per-run bounded builder",
          "uses": "docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435",
          "with": {
            "name": "${{ env.BUILDER_NAME }}",
            "driver": "docker-container",
            "use": false,
            "install": false,
            "cleanup": true,
            "keep-state": false,
            "driver-opts": "memory=5g\nmemory-swap=6g\ncpu-period=100000\ncpu-quota=150000\nrestart-policy=no",
            "buildkitd-flags": "--oci-worker-gc=true",
            "buildkitd-config-inline": "[worker.oci]\n  max-parallelism = 1"
          }
        },
        {
          "name": "Build exact learner image",
          "env": {},
          "run": "docker buildx build --builder \"$BUILDER_NAME\" --load --platform linux/amd64 \\\n --tag \"$IMAGE_TAG\" --label \"wanli.ci.run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\" \\\n --label \"org.opencontainers.image.revision=$GITHUB_SHA\" \\\n --build-arg NEXT_BUILD_NODE_OPTIONS=--max-old-space-size=3072 \\\n --build-arg OPENMAIC_BUILD_CPUS=1 \\\n --build-arg NEXT_PUBLIC_OPENMAIC_DEPLOYMENT_MODE=learner \\\n --build-arg NEXT_PUBLIC_PERSISTENCE= \\\n --build-arg NEXT_PUBLIC_PRO_WORKBENCH_ENABLED=false \\\n --build-arg NEXT_PUBLIC_MAIC_EDITOR_ENABLED=false \\\n --build-arg NEXT_PUBLIC_MAIC_EDITOR_RENDERER_ENABLED=false \\\n --build-arg NEXT_PUBLIC_PI_CHAT_ENABLED=false \\\n --build-arg NEXT_PUBLIC_ENABLE_VIDEO_EXPORT=false \\\n --build-arg NEXT_PUBLIC_ENABLE_PPTX_IMPORT=false ."
        },
        {
          "name": "Stop own idle builder before runtime checks",
          "env": {},
          "run": "docker buildx stop \"$BUILDER_NAME\""
        },
        {
          "name": "Start isolated exact-image candidate",
          "run": "python3 scripts/ci/nobel-resources.py start"
        },
        {
          "name": "Verify all runtime prompt hashes",
          "run": "python3 scripts/ci/nobel-resources.py prompts"
        },
        {
          "name": "Image API readiness boundary (synthetic, no model)",
          "run": "node scripts/qa-learner-image-boundary.mjs"
        },
        {
          "name": "Isolated desktop and mobile regression (fixtures, not full course acceptance)",
          "run": "python3 scripts/ci/nobel-resources.py browser"
        },
        {
          "name": "Export tested image for review, not deployment",
          "run": "mkdir -p artifacts/learner-image\ndocker image inspect \"$IMAGE_TAG\" --format '{{json .Id}}' > artifacts/learner-image/image-id.json\ngit rev-parse HEAD > artifacts/learner-image/source-sha.txt\ndocker save \"$IMAGE_TAG\" | gzip -1 > artifacts/learner-image/image.tar.gz\ncd artifacts/learner-image\nsha256sum image.tar.gz > image.tar.gz.sha256"
        },
        {
          "name": "Save tested image",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "learner-image-${{ github.sha }}-${{ github.run_attempt }}",
            "path": "artifacts/learner-image/",
            "retention-days": 1,
            "compression-level": 0
          }
        },
        {
          "name": "Collect bounded diagnostics and remove only owned containers and tag",
          "if": "always()",
          "run": "python3 scripts/ci/nobel-resources.py cleanup"
        },
        {
          "name": "Save evidence (not full course acceptance)",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "learner-image-qa-${{ github.sha }}-${{ github.run_attempt }}",
            "path": "artifacts/learner-image-qa/\nartifacts/learner-site-qa/",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
