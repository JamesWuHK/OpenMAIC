{
  "name": "Nobel07 bounded real UI model and speech pilot",
  "on": {
    "push": {
      "branches": [
        "codex/nobel07-real-ui-20261104"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "nobel07-real-ui-pilot-20261104",
    "cancel-in-progress": false
  },
  "jobs": {
    "pilot": {
      "if": "${{ github.event.repository.private == false }}",
      "runs-on": "ubuntu-22.04",
      "timeout-minutes": 45,
      "env": {
        "CI": "true",
        "NEXT_TELEMETRY_DISABLED": "1",
        "PUPPETEER_SKIP_DOWNLOAD": "true",
        "TASK_WORKSPACE": "${{ github.workspace }}/nobel07-app-${{ github.run_id }}-${{ github.run_attempt }}",
        "NODE_OPTIONS": "--max-old-space-size=4096",
        "NOBEL07_CLOUD_LANE": "github-hosted-public-standard"
      },
      "defaults": {
        "run": {
          "working-directory": "nobel07-app-${{ github.run_id }}-${{ github.run_attempt }}"
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false,
            "path": "nobel07-app-${{ github.run_id }}-${{ github.run_attempt }}",
            "fetch-depth": 1,
            "sparse-checkout": ".github\napp\ncommunity\ncomponents\nconfigs\ncontent\ndeploy\ne2e\neval\nlib\npackages\npublic\nrender-service\nscripts\nskills\ntests\ntypes\nci/nobel07-native\nci/nobel07-real-ui"
          },
          "timeout-minutes": 8,
          "env": {
            "GIT_CONFIG_COUNT": "3",
            "GIT_CONFIG_KEY_0": "http.version",
            "GIT_CONFIG_VALUE_0": "HTTP/1.1",
            "GIT_CONFIG_KEY_1": "http.lowSpeedLimit",
            "GIT_CONFIG_VALUE_1": "1024",
            "GIT_CONFIG_KEY_2": "http.lowSpeedTime",
            "GIT_CONFIG_VALUE_2": "30"
          }
        },
        {
          "name": "Make room only in disposable public GitHub runner; no shared host or production cleanup",
          "run": "python3 ci/nobel07-native/verify_cloud_lane.py\npython3 - <<'ROOM'\nimport os,json,subprocess\nfrom pathlib import Path\nfrom sys import path\npath.insert(0,'ci/nobel07-native')\nfrom verify_cloud_lane import verify_cloud_lane\nassert verify_cloud_lane()['lane']=='github-hosted-public-standard'\nallowed=[Path('/usr/local/lib/android'),Path('/usr/share/dotnet'),Path('/opt/ghc'),Path('/opt/hostedtoolcache/CodeQL')]\nout=Path('artifacts');out.mkdir(exist_ok=True);records=[]\nfor target in allowed:\n if target.exists() or target.is_symlink():\n  assert str(target) in ['/usr/local/lib/android','/usr/share/dotnet','/opt/ghc','/opt/hostedtoolcache/CodeQL']\n  subprocess.run(['sudo','rm','-rf','--',str(target)],check=True,timeout=120)\n  records.append(str(target))\ns=os.statvfs(Path.cwd());proof={'lane':'github-hosted-public-standard','removedPreinstalledUnusedSDKs':records,'freeBytes':s.f_bavail*s.f_frsize,'freeInodes':s.f_favail,'productionTouched':False,'sharedSelfHostedMachineTouched':False};(out/'public-ci-room.json').write_text(json.dumps(proof,indent=2)+'\\n');print(json.dumps(proof))\nROOM"
        },
        {
          "name": "Verify owned cloud resources, exact inputs and isolated classroom fixture",
          "run": "python3 ci/nobel07-native/app-check.py"
        },
        {
          "uses": "pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1",
          "with": {
            "package_json_file": "nobel07-app-${{ github.run_id }}-${{ github.run_attempt }}/package.json"
          }
        },
        {
          "name": "Verify exact previously accepted image workflow before downloading",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 - <<'PROVENANCE'\nimport urllib.request,json,os\nurl='https://api.github.com/repos/JamesWuHK/OpenMAIC/actions/runs/41818557352'\nrequest=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})\nwith urllib.request.urlopen(request,timeout=20) as response: result=json.load(response)\nassert result['head_sha']=='9f4ebb3869d13a14d6ca02540e05bc90b7a24727'\nassert result['status']=='completed' and result['conclusion']=='success'\nassert result['event']=='push' and result['head_branch']=='codex/nobel07-public-ci-20261104'\nassert result['path']=='.github/workflows/nobel07-native-app.yml' and result['repository']['full_name']=='JamesWuHK/OpenMAIC'\nprint('Exact source cloud build and native acceptance workflow succeeded; not a release approval.')\nPROVENANCE"
        },
        {
          "name": "Download immutable accepted image archive",
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "github-token": "${{ github.token }}",
            "run-id": 41818557352,
            "repository": "JamesWuHK/OpenMAIC",
            "name": "learner-image-9f4ebb3869d13a14d6ca02540e05bc90b7a24727",
            "path": "${{ env.TASK_WORKSPACE }}/artifacts/tested-image"
          }
        },
        {
          "name": "Verify real-UI QA inputs and install pinned browser driver only",
          "run": "python3 - <<'INPUTS'\nfrom pathlib import Path\nimport json,hashlib\nq=Path('ci/nobel07-real-ui')\nfor name,sha in json.loads((q/'input-manifest.json').read_text()).items(): assert hashlib.sha256((q/name).read_bytes()).hexdigest()==sha,name\nINPUTS\nPLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm --prefix ci/nobel07-real-ui ci --ignore-scripts --no-audit --no-fund"
        },
        {
          "name": "Prepare isolated candidate-only catalog",
          "run": "python3 ci/nobel07-real-ui/prepare-real-catalog.py"
        },
        {
          "name": "Three bounded real UI model and same-role speech cases; not full release acceptance",
          "timeout-minutes": 25,
          "run": "python3 ci/nobel07-real-ui/run-real-ui-cloud.py"
        },
        {
          "name": "Save limited real UI evidence for independent review",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "nobel07-real-ui-${{ github.sha }}",
            "path": "${{ env.TASK_WORKSPACE }}/artifacts/nobel07-real-ui/",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
