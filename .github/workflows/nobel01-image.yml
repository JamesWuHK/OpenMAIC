name: Nobel story licensed photo image
on:
  push:
    branches: [codex/nobel-story-photo-20261023]
permissions:
  contents: read
concurrency:
  group: nobel-story-photo-candidate
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - name: Build isolated learner image
        run: |
          docker build --platform linux/amd64 --tag "wanli-nobel01:$GITHUB_SHA" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --build-arg NEXT_BUILD_NODE_OPTIONS=--max-old-space-size=3072 \
            --build-arg OPENMAIC_BUILD_CPUS=1 \
            --build-arg NEXT_PUBLIC_OPENMAIC_DEPLOYMENT_MODE=learner \
            --build-arg NEXT_PUBLIC_PERSISTENCE= \
            --build-arg NEXT_PUBLIC_PRO_WORKBENCH_ENABLED=false \
            --build-arg NEXT_PUBLIC_MAIC_EDITOR_ENABLED=false \
            --build-arg NEXT_PUBLIC_MAIC_EDITOR_RENDERER_ENABLED=false \
            --build-arg NEXT_PUBLIC_PI_CHAT_ENABLED=false \
            --build-arg NEXT_PUBLIC_ENABLE_VIDEO_EXPORT=false \
            --build-arg NEXT_PUBLIC_ENABLE_PPTX_IMPORT=false .
      - name: Check exact image health
        run: |
          docker run -d --name nobel-candidate -p 127.0.0.1:3100:3000 \
            -e OPENMAIC_DEPLOYMENT_MODE=learner "wanli-nobel01:$GITHUB_SHA"
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3100/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Export candidate for course QA before release
        run: |
          mkdir -p artifacts/nobel01
          git rev-parse HEAD > artifacts/nobel01/source-sha.txt
          docker inspect nobel-candidate --format '{{.Image}}' > artifacts/nobel01/image-id.txt
          docker save "wanli-nobel01:$GITHUB_SHA" | gzip -1 > artifacts/nobel01/image.tar.gz
          cd artifacts/nobel01
          sha256sum image.tar.gz > image.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nobel01-image-candidate
          path: artifacts/nobel01/
          retention-days: 2
          compression-level: 0
      - name: Candidate diagnostics
        if: always()
        run: |
          mkdir -p artifacts/diagnostics
          docker logs nobel-candidate > artifacts/diagnostics/container.log 2>&1 || true
          docker rm -f nobel-candidate || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nobel01-build-diagnostics
          path: artifacts/diagnostics
          retention-days: 3
